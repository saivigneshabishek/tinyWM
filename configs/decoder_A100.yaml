seed: 404
device: cuda
bf16: true

dataset:
  path: data/smb_30fps_256x240_chunk16.h5
  height: 240
  width: 256
  window_len: 6
  stride: 1
  n_val_episodes: 25
  seed: ${seed}

dataloader:
  batch_size: 64
  num_workers: 8

TinyWorldModel:
  dim: 384
  n_actions: 16 # number of actions
  dropout: 0.1

  ViTEncoder:
    height: ${dataset.height}
    width: ${dataset.width}
    dim: ${TinyWorldModel.dim}
    patch_size: 16
    dropout: ${TinyWorldModel.dropout}
    n_heads: 6
    n_blocks: 6

  DynamicsPredictor:
    dim: ${TinyWorldModel.dim}
    dropout: ${TinyWorldModel.dropout}
    n_heads: 6
    n_blocks: 8
    n_pred_frames: 5

TinyWMDecoder:
  dim: 384
  height: ${dataset.height}
  width: ${dataset.width}
  patch_size: 16
  dropout: 0.1
  n_heads: 6
  n_blocks: 3
  up_channels: 128

loss:
  rollout:
    use: true
    weight: 0.2

optimizer:
  lr: 1e-4
  weight_decay: 1e-3

train:
  epochs: 100
  val_interval: 2

checkpoint:
  out_dir: checkpoints/decoder
  resume_from:

wandb:
  enabled: true
  project: tinyWM
  entity: 
  run_name: baseDecoderRun
  dir: runs/wandb
